name: Build and Publish Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: "https://download.pytorch.org/whl/cpu"
            torch_version: "torch==2.6.0+cpu torchaudio==2.6.0+cpu"
          - variant: gpu
            torch_index: "https://download.pytorch.org/whl/cu124"
            torch_version: "torch==2.6.0+cu124 torchaudio==2.6.0+cu124"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Base Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wheel setuptools
          pip install -r requirements.txt

      - name: Install Target PyTorch Variant (${{ matrix.variant }})
        run: |
          pip install ${{ matrix.torch_version }} --index-url ${{ matrix.torch_index }}

      - name: Build, Inject Model & Package (${{ matrix.variant }})
        run: |
          python build_in_ci.py --variant ${{ matrix.variant }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "FA-ASMR V2.0.0 (内置模型·开箱即用版)"
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
